# Slerp's fuzz targets, built by cargo-fuzz with a nightly compiler (see
# README.md and tools/fuzz.sh).  A workspace of its own, so the main one and
# its Rust 1.93 builds never see it.
[workspace]
members = ["."]

[package]
name = "slerp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[lib]
name = "slerp_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
libc = "0.2"
slerp-scene = { path = "../crates/scene" }
slerp-textures = { path = "../crates/textures" }
slerp-archive = { path = "../crates/archive", optional = true }
slerp-blend = { path = "../crates/blend", optional = true }
slerp-cad = { path = "../crates/cad", optional = true }
slerp-core = { path = "../crates/core", optional = true }
slerp-dicom = { path = "../crates/dicom", optional = true }
slerp-dna = { path = "../crates/dna", optional = true }
slerp-documents = { path = "../crates/documents", optional = true }
slerp-engines = { path = "../crates/engines", optional = true }
slerp-formats = { path = "../crates/formats" }
slerp-gameimages = { path = "../crates/gameimages", optional = true }
slerp-gltf = { path = "../crates/gltf", optional = true }
slerp-images = { path = "../crates/images", optional = true }
slerp-lut = { path = "../crates/lut" }
slerp-materials = { path = "../crates/materials", optional = true }
slerp-max = { path = "../crates/max", optional = true }
slerp-maya = { path = "../crates/maya", optional = true }
slerp-metafile = { path = "../crates/metafile", optional = true }
slerp-minecraft = { path = "../crates/minecraft", optional = true }
slerp-models = { path = "../crates/models", optional = true }
slerp-openexr = { path = "../crates/openexr", optional = true }
slerp-paint = { path = "../crates/paint", optional = true }
slerp-paths = { path = "../crates/paths", optional = true }
slerp-previews = { path = "../crates/previews", optional = true }
slerp-quake = { path = "../crates/quake", optional = true }
slerp-retro = { path = "../crates/retro", optional = true }
slerp-rigged = { path = "../crates/rigged", optional = true }
slerp-roblox = { path = "../crates/roblox", optional = true }
slerp-sketchup = { path = "../crates/sketchup", optional = true }
slerp-splats = { path = "../crates/splats", optional = true }
slerp-sprites = { path = "../crates/sprites" }
slerp-svg = { path = "../crates/svg", optional = true }
slerp-tiff = { path = "../crates/tiff", optional = true }
slerp-jxr = { path = "../crates/jxr", optional = true }
slerp-volumes = { path = "../crates/volumes", optional = true }

# One feature per target, naming the crates it needs, so that a crate
# being edited elsewhere stops only the targets that use it.
[features]
archive = ["dep:slerp-archive"]
blend = ["dep:slerp-blend"]
cad = ["dep:slerp-cad"]
contents = ["dep:slerp-core"]
core_sniff = ["dep:slerp-core"]
core_thumbnail = ["dep:slerp-core"]
dicom = ["dep:slerp-dicom"]
dna = ["dep:slerp-dna"]
documents = ["dep:slerp-documents", "dep:slerp-metafile"]
engines = ["dep:slerp-engines"]
gameimages = ["dep:slerp-gameimages"]
gltf = ["dep:slerp-gltf"]
images = ["dep:slerp-images"]
jxr = ["dep:slerp-jxr"]
lut = []
materials = ["dep:slerp-materials"]
max = ["dep:slerp-max", "dep:slerp-previews"]
maya = ["dep:slerp-maya"]
metafile = ["dep:slerp-metafile"]
minecraft = ["dep:slerp-minecraft"]
models = ["dep:slerp-models"]
models_text = ["dep:slerp-models"]
openexr = ["dep:slerp-openexr"]
paint = ["dep:slerp-paint"]
palette = ["dep:slerp-previews"]
paths = ["dep:slerp-paths"]
previews = ["dep:slerp-previews", "dep:slerp-metafile"]
quake = ["dep:slerp-quake"]
retro = ["dep:slerp-retro"]
rigged = ["dep:slerp-rigged"]
roblox = ["dep:slerp-roblox"]
sketchup = ["dep:slerp-sketchup", "dep:slerp-previews"]
splats = ["dep:slerp-splats"]
sprites = []
svg = ["dep:slerp-svg"]
textures = []
tiff = ["dep:slerp-tiff"]
volumes = ["dep:slerp-volumes"]

# Fuzz builds are release builds (`cargo fuzz build -O`, which leaves
# debug assertions off everywhere).  Slerp's own crates turn overflow checks
# and debug assertions back on below, so an overflow in them is a crash;
# other people's crates build as they ship, where arithmetic wraps, so an
# overflow check inside them (the laz crate has several) isn't mistaken for
# a crash that release builds would have.
[profile.release]
debug = "line-tables-only"

[profile.release.package.slerp-fuzz]
overflow-checks = true
debug-assertions = true

[profile.release.package.slerp-archive]
overflow-checks = true
debug-assertions = true

[profile.release.package.slerp-blend]
overflow-checks = true
debug-assertions = true

[profile.release.package.slerp-cad]
