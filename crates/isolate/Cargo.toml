[package]
name = "slerp-isolate"
description = "Running untrusted-file decoders in a child process with time and memory limits, for Slerp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A leaf crate: any loader may use it without depending on another loader.
[dependencies]
libc = "0.2"

# Job objects (memory limits, kill on close) and quiet crashes for the child
# programs Windows runs jobs in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Threading",
] }

# The program the tests in tests/process.rs start; it serves the test jobs
# in src/testing.rs.
[[bin]]
name = "isolate_child"
path = "src/bin/isolate_child.rs"
test = false
doc = false
