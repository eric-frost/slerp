[package]
name = "slerp-associate"
description = "Slerp's file association manager: which formats get Slerp's thumbnails and open in Slerp by default, on Linux desktops, Windows and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
slerp-core.workspace = true
slerp-formats.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The registry, and telling Explorer that associations changed.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"
