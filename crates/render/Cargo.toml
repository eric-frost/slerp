[package]
name = "slerp-render"
description = "GPU selection and the wgpu renderer shared by Slerp's thumbnails and viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
slerp-scene.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
# f32 to f16 conversion for HDR textures, which upload as Rgba16Float.
half = { version = "2", features = ["bytemuck"] }
# Packs a scene's primitives for the GPU in parallel.
rayon.workspace = true

# Linux picks its GPU and Vulkan driver from sysfs and the Wayland
# compositor.  The pure-Rust Wayland client asks only which GPU the
# compositor renders on (zwp_linux_dmabuf_v1's main device); no libwayland.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
rustix = { version = "1", features = ["event"] }

# Windows renders on Direct3D 12 (WARP without a GPU), with Vulkan too when
# a driver is installed; macOS renders on Metal.  The workspace's Vulkan
# feature does nothing on Apple platforms.
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }
# The known-folder paths (Local AppData for the pipeline cache).
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[dev-dependencies]
png = "0.18"
# Real models and maps for the examples and reference tests.
slerp-gltf.workspace = true
slerp-quake.workspace = true
# Validates the WGSL in unit tests without a GPU, and translates it to
# Metal and HLSL as macOS and Windows will.  Same version wgpu uses.
naga = { version = "29", features = ["wgsl-in", "msl-out", "hlsl-out"] }
