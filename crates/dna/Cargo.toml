[package]
name = "slerp-dna"
description = "MetaHuman DNA files for Slerp, read and evaluated with Epic's openriglogic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Slerp's own code; the vendored openriglogic in `openriglogic/` is MIT
# (Epic Games, its LICENSE kept beside it).
license.workspace = true
build = "build.rs"
links = "slerp_openriglogic"

[dependencies]
slerp-scene.workspace = true
glam.workspace = true
thiserror.workspace = true
rayon.workspace = true
cxx = "1.0.194"
# Reading a DNA file runs in a child process, so a fault in the C++ reader
# costs one thumbnail instead of the helper serving every file.
slerp-isolate = { path = "../isolate" }

[build-dependencies]
cxx-build = "1.0.194"
cc = { version = "1.2", features = ["parallel"] }

[dev-dependencies]
# Thumbnails as the file manager gets them, and posed renders, in the
# `render` example and the tests against chalk's baked heads.
slerp-core = { path = "../core" }
slerp-gltf.workspace = true
