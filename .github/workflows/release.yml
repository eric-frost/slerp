# Builds Slerp's release files for Linux (x86_64 and arm64), Windows (x64)
# and macOS (Apple Silicon), smoke-tests each, and gathers them for a
# release.
#
# - A pushed v* tag builds everything, writes SHA256SUMS, attests where each
#   file was built (`gh attestation verify FILE --repo eric-frost/slerp`),
#   and creates a draft release with packaging/release-notes.md as its text,
#   for a person to check and publish.
# - Run by hand (workflow_dispatch), it builds and tests everything and keeps
#   the files as the run's artifacts only.  With "draft" ticked it also
#   attests them and makes a draft release named v<version>-test, to try
#   those steps; delete that draft afterwards.
#
# The test samples aren't in the repository, so this builds and smoke-tests
# but doesn't run cargo test.  Rust stays at the version egui 0.35 and the
# developers' machines build with.  Third-party actions are pinned by commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: Also attest the files and make a draft release named v<version>-test
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.93.1"
  CARGO_DEB_VERSION: "3.8.0"
  NFPM_VERSION: "2.48.0"
  INNO_VERSION: "6.7.3"
  INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc 2.35 and Qt 6.2, so the packages install on
          # Ubuntu 22.04, Debian 12, Fedora and newer.
          - arch: x86_64
            runner: ubuntu-22.04
            nfpm: x86_64
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
          - arch: aarch64
            runner: ubuntu-22.04-arm
            nfpm: arm64
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libclang-dev libwayland-dev libxkbcommon-dev \
            pkg-config g++ cmake qt6-base-dev dpkg-dev
          tools/ci-rustup.sh "$RUST_VERSION"
          export PATH=$HOME/.cargo/bin:$PATH
          cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz"
          echo "${{ matrix.nfpm_sha256 }}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C /usr/local/bin nfpm
      - name: Build the packages
        run: tools/build-linux.sh
      - name: Build the Qt test program
        run: cmake --build local/target/qt-release --target slerp-qt-check
      - name: Test the packages
        env:
          QT_CHECK: local/target/qt-release/slerp-qt-check
          LINT: "0"
        run: |
          tools/test-packages.sh deb ubuntu:22.04
          tools/test-packages.sh rpm fedora:latest
          tools/test-packages.sh tar debian:12
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            local/dist/*.deb
            local/dist/*.rpm
            local/dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-qt-check-${{ matrix.arch }}
          path: local/target/qt-release/slerp-qt-check
          retention-days: 14

  arch:
    name: Arch Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # makepkg builds packaging/aur/PKGBUILD from the source tarball in an
      # archlinux container, with Arch's own Rust, as AUR users would.
      - name: Build and test the packages
        env:
          LINT: "0"
        run: |
          tools/source-tarball.sh
          tools/test-packages.sh aur
          cp local/dist/test-aur/archlinux-latest/*.pkg.tar.zst local/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-arch
          path: local/dist/*.pkg.tar.zst
          if-no-files-found: error

  windows-build:
    name: Windows x64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Cross-compiled with MinGW, as on the developers' machines, whose
    # Ubuntu 26.04 compilers this container matches.
    container: ubuntu:26.04
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git \
            gcc libc6-dev gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 \
            libclang-dev zip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: tools/ci-rustup.sh "$RUST_VERSION" x86_64-pc-windows-gnu
      - name: Build
        run: tools/build-windows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip
          path: local/dist/Slerp-windows-x64.zip
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # The shell scripts must keep their Unix line endings for Git Bash.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-zip
          path: local/dist
      - name: Unpack
        shell: pwsh
        run: Expand-Archive local\dist\Slerp-windows-x64.zip -DestinationPath local\stage
      - name: Smoke-test
        shell: bash
        env:
          SMOKE_GPU: optional
        run: tools/smoke-test.sh local/stage/Slerp/slerp.exe local/smoke
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION -replace '\.','_')/innosetup-$env:INNO_VERSION.exe" -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw "innosetup-$env:INNO_VERSION.exe has the wrong checksum" }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup's installer exited with $($p.ExitCode)" }
      - name: Make the installer
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Qp "/DSource=$pwd\local\stage\Slerp" "/O$pwd\local\dist" packaging\windows\slerp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
      - name: Test the installer
        shell: pwsh
        run: tools/test-windows-installer.ps1 -Setup local\dist\Slerp-Setup-windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            local/dist/Slerp-Setup-windows-x64.exe
            local/dist/Slerp-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: tools/ci-rustup.sh "$RUST_VERSION"
      - name: Build the app, zip and disk image
        env:
          SLERP_MAC_JOBS: "3"
        run: tools/macos-app.sh
      - name: Smoke-test
        env:
          SMOKE_GPU: optional
        run: |
          tools/smoke-test.sh local/dist/Slerp.app/Contents/MacOS/Slerp local/smoke
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" local/dist/Slerp-macos-arm64.dmg
          test -L "$mount/Applications"
          codesign --verify --strict --deep --verbose=1 "$mount/Slerp.app"
          test -f "$mount/Slerp.app/Contents/Resources/Slerp.icns"
          "$mount/Slerp.app/Contents/MacOS/Slerp" --version
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            local/dist/Slerp-macos-arm64.zip
            local/dist/Slerp-macos-arm64.dmg
          if-no-files-found: error

  release:
    name: Checksums and draft release
    needs: [linux, arch, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check the files and write SHA256SUMS
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          rev=$(sed -n '1s/^slerp ([^-]*-\([^)]*\)).*/\1/p' packaging/debian/changelog)
          cd dist
          for f in Slerp-Setup-windows-x64.exe Slerp-windows-x64.zip Slerp-macos-arm64.dmg Slerp-macos-arm64.zip \
            "slerp_$version-${rev}_amd64.deb" "slerp-qt-plugin_$version-${rev}_amd64.deb" \
            "slerp_$version-${rev}_arm64.deb" "slerp-qt-plugin_$version-${rev}_arm64.deb" \
            "slerp-$version-$rev.x86_64.rpm" "slerp-qt-plugin-$version-$rev.x86_64.rpm" \
            "slerp-$version-$rev.aarch64.rpm" "slerp-qt-plugin-$version-$rev.aarch64.rpm" \
            "slerp-$version-$rev-x86_64.pkg.tar.zst" "slerp-qt-plugin-$version-$rev-x86_64.pkg.tar.zst" \
            "slerp-$version-linux-x86_64.tar.gz" "slerp-$version-linux-aarch64.tar.gz"; do
            [ -f "$f" ] || { echo "missing: $f"; exit 1; }
          done
          [ "$(ls | wc -l)" = 16 ] || { echo "unexpected files:"; ls; exit 1; }
          sha256sum -- * > SHA256SUMS
          ls -l
          cat SHA256SUMS
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Attest the files
        if: github.event_name == 'push' || inputs.draft
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Make the draft release
        if: github.event_name == 'push' || inputs.draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$GITHUB_REF_NAME
            [ "$tag" = "v$VERSION" ] || { echo "the tag $tag doesn't match the version $VERSION in Cargo.toml"; exit 1; }
          else
            tag=v$VERSION-test
          fi
          notes=packaging/release-notes.md
          if [ ! -f "$notes" ]; then
            [ "$GITHUB_EVENT_NAME" != push ] || { echo "$notes is missing"; exit 1; }
            notes=$RUNNER_TEMP/notes.md
            echo "A test of the release workflow; delete this draft." > "$notes"
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Slerp $VERSION" --notes-file "$notes" dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-release-files
          path: dist
          if-no-files-found: error
